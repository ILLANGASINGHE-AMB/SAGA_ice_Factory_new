<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser tab icon. The .ico carries every size from 16px to 256px, so
         the tab, the bookmark bar and Windows shortcuts each pick their own.
         The old favicon.svg link is gone on purpose: Chrome prefers an SVG
         whenever both are declared, which would have kept showing the
         previous mark. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Home-screen icon when the page is installed as an app.
         iOS ignores both the manifest icons and .ico files for this, and
         reads apple-touch-icon alone; Android/Chrome reads the manifest. Both
         are declared so "Add to Home Screen" shows the logo on either phone. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover fills notched/rounded tablet screens;
         interactive-widget=resizes-content keeps the on-screen keyboard from
         shoving fixed headers and modals off the top of the display.
         Pinch-zoom is left enabled on purpose — operators do use it to read
         dense report tables. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sagacious Ice" />
    <meta name="theme-color" content="#0284c7" />
    <title>Sagacious Ice Factory Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
