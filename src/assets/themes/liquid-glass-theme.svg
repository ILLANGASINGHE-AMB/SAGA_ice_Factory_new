<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef4ff" />
      <stop offset="45%" stop-color="#e7f0ff" />
      <stop offset="100%" stop-color="#f3edff" />
    </linearGradient>
    <radialGradient id="lg-blob-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lg-blob-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lg-blob-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lg-blob-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lg-blob-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
    </radialGradient>
    <filter id="lg-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <linearGradient id="lg-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#lg-base)" />

  <g filter="url(#lg-soft)">
    <circle cx="260" cy="200" r="320" fill="url(#lg-blob-blue)" />
    <circle cx="1300" cy="180" r="360" fill="url(#lg-blob-violet)" />
    <circle cx="1150" cy="700" r="380" fill="url(#lg-blob-pink)" />
    <circle cx="300" cy="720" r="300" fill="url(#lg-blob-mint)" />
    <circle cx="800" cy="450" r="420" fill="url(#lg-blob-amber)" />
  </g>

  <ellipse cx="800" cy="450" rx="900" ry="500" fill="url(#lg-sheen)" />

  <g stroke="#ffffff" stroke-opacity="0.35" fill="none" stroke-width="1.5">
    <circle cx="1300" cy="180" r="360" />
    <circle cx="260" cy="200" r="320" />
    <circle cx="1150" cy="700" r="380" />
    <circle cx="300" cy="720" r="300" />
  </g>
</svg>
