<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="batSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12151d"/>
      <stop offset="55%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="batGlow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#9fb4c9" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#9fb4c9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9fb4c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0803c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f0803c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#batSky)"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#batGlow)"/>

  <!-- Searchlight beams (generic crossed spotlights, no emblem) -->
  <g fill="#c7d5e0" opacity="0.1">
    <polygon points="430,800 560,800 900,40 830,40"/>
    <polygon points="770,800 640,800 300,40 370,40"/>
  </g>

  <!-- Distant haze -->
  <g fill="#2a3040" opacity="0.35">
    <ellipse cx="250" cy="560" rx="220" ry="70"/>
    <ellipse cx="900" cy="580" rx="260" ry="80"/>
  </g>

  <!-- Flying bat silhouette -->
  <g transform="translate(600,200) scale(0.85)" fill="#05060a">
    <polygon points="10,-8 35,-25 55,-15 85,-38 100,-20 140,-45 155,-22 200,-30 230,5 190,25 140,15 95,22 55,12 20,10"/>
    <polygon points="-10,-8 -35,-25 -55,-15 -85,-38 -100,-20 -140,-45 -155,-22 -200,-30 -230,5 -190,25 -140,15 -95,22 -55,12 -20,10"/>
    <ellipse cx="0" cy="0" rx="14" ry="10"/>
    <polygon points="-9,-10 -14,-23 -3,-12"/>
    <polygon points="9,-10 14,-23 3,-12"/>
  </g>

  <!-- Rain -->
  <g stroke="#8fa0b3" stroke-width="1.5" opacity="0.18">
    <line x1="80" y1="0" x2="40" y2="120"/>
    <line x1="220" y1="60" x2="180" y2="180"/>
    <line x1="380" y1="10" x2="340" y2="130"/>
    <line x1="560" y1="80" x2="520" y2="200"/>
    <line x1="720" y1="20" x2="680" y2="140"/>
    <line x1="880" y1="90" x2="840" y2="210"/>
    <line x1="1020" y1="30" x2="980" y2="150"/>
    <line x1="1150" y1="100" x2="1110" y2="220"/>
  </g>

  <!-- Skyline silhouette -->
  <g fill="#0c0e13">
    <rect x="0" y="560" width="90" height="240"/>
    <rect x="70" y="500" width="60" height="300"/>
    <rect x="120" y="600" width="80" height="200"/>
    <rect x="190" y="470" width="70" height="330"/>
    <polygon points="205,470 225,410 245,470"/>
    <rect x="255" y="620" width="100" height="180"/>
    <rect x="345" y="540" width="55" height="260"/>
    <rect x="390" y="580" width="90" height="220"/>
    <rect x="470" y="500" width="65" height="300"/>
    <rect x="525" y="630" width="110" height="170"/>
    <rect x="620" y="470" width="75" height="330"/>
    <polygon points="635,470 657,395 680,470"/>
    <rect x="685" y="600" width="85" height="200"/>
    <rect x="760" y="540" width="60" height="260"/>
    <rect x="810" y="580" width="95" height="220"/>
    <rect x="895" y="490" width="70" height="310"/>
    <rect x="955" y="620" width="100" height="180"/>
    <rect x="1040" y="530" width="60" height="270"/>
    <rect x="1090" y="570" width="110" height="230"/>
  </g>

  <!-- Sparse lit windows -->
  <g fill="#e8b25a" opacity="0.55">
    <rect x="85" y="590" width="6" height="8"/>
    <rect x="100" y="630" width="6" height="8"/>
    <rect x="210" y="520" width="6" height="8"/>
    <rect x="230" y="560" width="6" height="8"/>
    <rect x="410" y="620" width="6" height="8"/>
    <rect x="490" y="540" width="6" height="8"/>
    <rect x="650" y="510" width="6" height="8"/>
    <rect x="670" y="550" width="6" height="8"/>
    <rect x="830" y="620" width="6" height="8"/>
    <rect x="915" y="530" width="6" height="8"/>
    <rect x="1000" y="570" width="6" height="8"/>
    <rect x="1110" y="610" width="6" height="8"/>
  </g>

  <!-- Distant fire glow (chaotic city mood) -->
  <circle cx="150" cy="720" r="90" fill="url(#fireGlow)"/>
  <circle cx="1000" cy="730" r="110" fill="url(#fireGlow)"/>

  <!-- Ground -->
  <rect x="0" y="780" width="1200" height="20" fill="#000000"/>
</svg>
