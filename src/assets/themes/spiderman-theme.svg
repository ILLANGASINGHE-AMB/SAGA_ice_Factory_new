<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="spiderSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa8e0"/>
      <stop offset="55%" stop-color="#a9d8f2"/>
      <stop offset="100%" stop-color="#e7f4fb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#spiderSky)"/>

  <!-- Sun glint -->
  <circle cx="1040" cy="120" r="80" fill="#fff6da" opacity="0.55"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="180" cy="140" rx="75" ry="28"/>
    <ellipse cx="240" cy="128" rx="55" ry="22"/>
    <ellipse cx="120" cy="130" rx="45" ry="18"/>
    <ellipse cx="620" cy="90" rx="60" ry="22"/>
    <ellipse cx="670" cy="80" rx="42" ry="16"/>
  </g>

  <!-- Red/blue hero color streaks, faint -->
  <g opacity="0.28">
    <polygon points="0,60 260,0 300,40 30,110" fill="#d32e3f"/>
    <polygon points="900,0 1200,20 1200,90 940,60" fill="#1e4fa0"/>
  </g>

  <!-- Web-line accent radiating from top-right corner -->
  <g stroke="#eef6fb" stroke-width="2" opacity="0.5" fill="none">
    <line x1="1200" y1="0" x2="880" y2="260"/>
    <line x1="1200" y1="0" x2="1020" y2="340"/>
    <line x1="1200" y1="0" x2="1160" y2="380"/>
    <line x1="1200" y1="0" x2="1080" y2="60"/>
    <path d="M1010,60 C980,110 970,150 950,190"/>
    <path d="M1075,150 C1030,190 1000,220 960,250"/>
    <path d="M1140,240 C1080,270 1030,290 980,310"/>
  </g>

  <!-- City skyline silhouette, as one path. Landmark spire tower is the tall
       subpath in the middle (generic, not a specific building's exact form);
       its base directly abuts its neighbors (no gap) since an isolated
       building bordered by open sky on both sides showed a hairline render
       seam in some SVG engines. -->
  <path fill="#3d5f80" d="M0,600 h70 v200 h-70 Z M60,540 h55 v260 h-55 Z M110,620 h80 v180 h-80 Z M185,470 h60 v330 h-60 Z M240,580 h90 v220 h-90 Z M325,520 h50 v280 h-50 Z M470,430 h70 v370 h-70 Z M375,600 h95 v200 h-95 Z M540,560 h65 v240 h-65 Z M600,610 h100 v190 h-100 Z M695,520 h55 v280 h-55 Z M745,640 h90 v160 h-90 Z M830,470 h65 v330 h-65 Z M890,580 h80 v220 h-80 Z M965,530 h55 v270 h-55 Z M1015,600 h95 v200 h-95 Z M1105,540 h60 v260 h-60 Z M1160,600 h40 v200 h-40 Z M470,430 L505,340 L540,430 Z"/>
  <line x1="505" y1="300" x2="505" y2="345" stroke="#5b7fa6" stroke-width="6"/>

  <!-- Window glints -->
  <g fill="#eaf4fb" opacity="0.6">
    <rect x="200" y="510" width="6" height="9"/>
    <rect x="220" y="550" width="6" height="9"/>
    <rect x="490" y="470" width="6" height="9"/>
    <rect x="510" y="510" width="6" height="9"/>
    <rect x="620" y="600" width="6" height="9"/>
    <rect x="850" y="510" width="6" height="9"/>
    <rect x="980" y="560" width="6" height="9"/>
    <rect x="1030" y="630" width="6" height="9"/>
  </g>
</svg>
